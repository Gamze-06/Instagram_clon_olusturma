<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Instagram Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="main-container">
    <div class="left-image">
      <img src="./doga_jpeg.jpg" alt="doga">
      <img src="./aksiyon_jpeg.jpg" alt="aksiyon">
      <img src="manzara_jpeg.jpg" alt="manzara">
    </div>

    <div class="login-box">
        <img src="./instagram-with-wordmark-seeklogo.png" alt="instagram" width="250">

      <form>
        <div class="form-group">
          <input type="text" class="form-control mb-2" placeholder="Telefon numarası, kullanıcı adı veya e-posta">
        </div>
        <div class="form-group">
          <input type="password" class="form-control mb-2" placeholder="Şifre">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Giriş yap</button>
      </form>

      <div class="or-divider">YA DA</div>

      <a href="#" class="btn btn-link text-primary"><strong>Facebook ile Giriş Yap</strong></a>

      <p class="mt-3"><a href="#" class="text-muted">Şifreni mi unuttun?</a></p>

      <hr>

      <p>Hesabın yok mu? <a href="#" class="text-primary">Kaydol</a></p>
    </div>
  </div>

  <div class="footer">
    <a href="#">Meta</a>
    <a href="#">Hakkında</a>
    <a href="#">Blog</a>
    <a href="#">İş Fırsatları</a>
    <a href="#">Yardım</a>
    <a href="#">API</a>
    <a href="#">Gizlilik</a>
    <a href="#">Koşullar</a>
    <a href="#">Konumlar</a>
    <a href="#">Instagram Lite</a>
    <a href="#">Threads</a>
    <a href="#">Kişi Yükleme ve Hesabı Olmayan Kişiler</a>
    <a href="#">Meta Verified</a>
    <br><br>
    <span>Türkçe © 2025 Instagram from Meta</span>
  </div>

</body>
</html>
